<svg viewBox="0 0 640 385" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4A52"></path></marker><marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"></path></marker></defs><rect x="250" y="18" width="140" height="46" rx="6" fill="#B5552A"></rect><text x="320" y="38" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">FUSO / MAGMA</text><text x="320" y="54" text-anchor="middle" fill="#F4EEE3" font-size="9">origine, 4,56 Ga BP</text><rect x="20" y="150" width="160" height="50" rx="6" fill="#3E4A52"></rect><text x="100" y="171" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">ROCCE IGNEE</text><text x="100" y="187" text-anchor="middle" fill="#DDD5C7" font-size="8.5">intrusive · ipoabissali · effusive</text><rect x="440" y="150" width="180" height="50" rx="6" fill="#3E4A52"></rect><text x="530" y="171" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">ROCCE METAMORFICHE</text><text x="530" y="187" text-anchor="middle" fill="#DDD5C7" font-size="8.5">ricristallizzazione allo stato solido</text><rect x="240" y="282" width="160" height="50" rx="6" fill="#C9A227"></rect><text x="320" y="303" text-anchor="middle" fill="#23282C" font-size="12" font-weight="600">ROCCE SEDIMENTARIE</text><text x="320" y="319" text-anchor="middle" fill="#23282C" font-size="8.5">sedimento → litificazione</text><path d="M252,54 C180,72 130,108 108,148" fill="none" stroke="#3E4A52" stroke-width="2.2" marker-end="url(#ar)"></path><text x="40" y="96" font-size="8.5" fill="#3E4A52">raffreddamento:</text><text x="40" y="108" font-size="8.5" fill="#3E4A52">solidificazione + cristallizzazione</text><path d="M120,202 C160,250 200,285 238,300" fill="none" stroke="#3E4A52" stroke-width="2.2" marker-end="url(#ar)"></path><text x="40" y="262" font-size="8.5" fill="#3E4A52">alterazione · erosione</text><text x="40" y="274" font-size="8.5" fill="#3E4A52">trasporto · deposito</text><path d="M402,300 C440,285 480,250 520,202" fill="none" stroke="#3E4A52" stroke-width="2.2" marker-end="url(#ar)"></path><text x="470" y="290" font-size="8.5" fill="#3E4A52">tettonica → in profondità</text><text x="470" y="302" font-size="8.5" fill="#3E4A52">↑ P, ↑ T, fluidi</text><path d="M532,148 C510,108 460,72 388,54" fill="none" stroke="#3E4A52" stroke-width="2.2" marker-end="url(#ar)"></path><text x="500" y="96" font-size="8.5" fill="#3E4A52">fusione</text><path d="M440,158 C380,118 260,118 182,158" fill="none" stroke="#C9A227" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar2)"></path><text x="320" y="126" text-anchor="middle" font-size="8" fill="#8a6f12">ignea → metamorfica (portata in profondità)</text><path d="M462,202 C420,235 380,255 345,280" fill="none" stroke="#C9A227" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar2)"></path><text x="422" y="233" text-anchor="middle" font-size="8" fill="#8a6f12">met. esposta → erosione</text><path d="M262,334 C230,350 230,362 262,368 C300,374 330,370 350,360" fill="none" stroke="#C9A227" stroke-width="1.6" stroke-dasharray="5 4"></path><path d="M350,360 L378,334" fill="none" stroke="#C9A227" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar2)"></path><text x="320" y="348" text-anchor="middle" font-size="8" fill="#8a6f12" transform="translate(0,-2)">sed → sed (esposta, erosa, ridepositata)</text><path d="M600,150 C640,140 640,210 600,200" fill="none" stroke="#C9A227" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar2)"></path><text x="560" y="222" font-size="8" fill="#8a6f12">met → met</text><path d="M320,282 L320,66" fill="none" stroke="#B5552A" stroke-width="1.4" stroke-dasharray="2 4"></path><circle cx="320" cy="180" r="11" fill="#fff" stroke="#B5552A" stroke-width="1.6"></circle><line x1="313" y1="173" x2="327" y2="187" stroke="#B5552A" stroke-width="1.6"></line><line x1="327" y1="173" x2="313" y2="187" stroke="#B5552A" stroke-width="1.6"></line><text x="320" y="208" text-anchor="middle" font-size="8.5" fill="#B5552A" font-weight="600">sedimentaria → fuso: NO</text><text x="320" y="219" text-anchor="middle" font-size="7.5" fill="#B5552A">passa prima dal metamorfismo</text></svg>
