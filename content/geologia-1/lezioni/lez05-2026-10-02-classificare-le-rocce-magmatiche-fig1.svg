<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif"><defs><marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#6B7378"></path></marker></defs><rect x="220" y="5" width="200" height="34" rx="5" fill="#F4EEE3" stroke="#3E4A52" stroke-width=".8"></rect><text x="320.0" y="19.5" text-anchor="middle" font-size="8.6" font-weight="600" fill="#23282C">1 · Tessitura</text><text x="320.0" y="30.5" text-anchor="middle" font-size="8.6" fill="#23282C">olocristallina, porfirica, micro/cripto, vetrosa</text><path d="M270,39 L120,62" stroke="#6B7378" stroke-width="1.3" marker-end="url(#af)"></path><text x="199.0" y="48.5" font-size="7.5" fill="#B5552A" font-weight="600">intrusiva (olocristallina)</text><path d="M370,39 L520,62" stroke="#6B7378" stroke-width="1.3" marker-end="url(#af)"></path><text x="449.0" y="48.5" font-size="7.5" fill="#B5552A" font-weight="600">effusiva</text><rect x="20" y="62" width="200" height="34" rx="5" fill="#F4EEE3" stroke="#3E4A52" stroke-width=".8"></rect><text x="120.0" y="76.5" text-anchor="middle" font-size="8.6" font-weight="600" fill="#23282C">2 · Femici ≥ 90%?</text><text x="120.0" y="87.5" text-anchor="middle" font-size="8.6" fill="#23282C">olivina + pirosseni</text><path d="M60,96 L60,118" stroke="#6B7378" stroke-width="1.3" marker-end="url(#af)"></path><text x="64.0" y="105.0" font-size="7.5" fill="#B5552A" font-weight="600">sì</text><path d="M180,96 L180,118" stroke="#6B7378" stroke-width="1.3" marker-end="url(#af)"></path><text x="184.0" y="105.0" font-size="7.5" fill="#B5552A" font-weight="600">no</text><rect x="5" y="118" width="110" height="40" rx="5" fill="#3E4A52" stroke="#3E4A52" stroke-width=".8"></rect><text x="60.0" y="130.0" text-anchor="middle" font-size="7.8" font-weight="600" fill="#fff">Triangolo</text><text x="60.0" y="141.0" text-anchor="middle" font-size="7.8" fill="#fff">ultrafemiche</text><text x="60.0" y="152.0" text-anchor="middle" font-size="7.8" fill="#fff">dunite · peridotite · pirossenite</text><rect x="125" y="118" width="140" height="40" rx="5" fill="#F4EEE3" stroke="#3E4A52" stroke-width=".8"></rect><text x="195.0" y="135.5" text-anchor="middle" font-size="8" font-weight="600" fill="#23282C">3 · Quarzo o feldspatoidi?</text><text x="195.0" y="146.5" text-anchor="middle" font-size="8" fill="#23282C">Q e F si escludono</text><path d="M150,158 L110,182" stroke="#6B7378" stroke-width="1.3" marker-end="url(#af)"></path><text x="134.0" y="168.0" font-size="7.5" fill="#B5552A" font-weight="600">Q visibile</text><path d="M195,158 L195,182" stroke="#6B7378" stroke-width="1.3" marker-end="url(#af)"></path><text x="199.0" y="168.0" font-size="7.5" fill="#B5552A" font-weight="600">né Q né F</text><path d="M240,158 L280,182" stroke="#6B7378" stroke-width="1.3" marker-end="url(#af)"></path><text x="264.0" y="168.0" font-size="7.5" fill="#B5552A" font-weight="600">F (bianchi globulari)</text><rect x="40" y="182" width="110" height="34" rx="5" fill="#E0B84A" stroke="#3E4A52" stroke-width=".8"></rect><text x="95.0" y="196.5" text-anchor="middle" font-size="7.8" font-weight="600" fill="#23282C">≥ 20% Q, sovrassatura</text><text x="95.0" y="207.5" text-anchor="middle" font-size="7.8" fill="#23282C">triangolo superiore</text><rect x="160" y="182" width="80" height="34" rx="5" fill="#E6D2B4" stroke="#3E4A52" stroke-width=".8"></rect><text x="200.0" y="196.5" text-anchor="middle" font-size="7.8" font-weight="600" fill="#23282C">satura</text><text x="200.0" y="207.5" text-anchor="middle" font-size="7.8" fill="#23282C">linea A–P</text><rect x="250" y="182" width="105" height="34" rx="5" fill="#D6C7B0" stroke="#3E4A52" stroke-width=".8"></rect><text x="302.5" y="196.5" text-anchor="middle" font-size="7.8" font-weight="600" fill="#23282C">sottosatura</text><text x="302.5" y="207.5" text-anchor="middle" font-size="7.8" fill="#23282C">triangolo inferiore</text><path d="M195,216 L195,236" stroke="#6B7378" stroke-width="1.3" marker-end="url(#af)"></path><rect x="90" y="236" width="210" height="34" rx="5" fill="#F4EEE3" stroke="#3E4A52" stroke-width=".8"></rect><text x="195.0" y="250.5" text-anchor="middle" font-size="8" font-weight="600" fill="#23282C">4 · Rapporto A / P</text><text x="195.0" y="261.5" text-anchor="middle" font-size="8" fill="#23282C">alcalini colorati idiomorfi vs plagioclasio bianco</text><path d="M195,270 L195,290" stroke="#6B7378" stroke-width="1.3" marker-end="url(#af)"></path><rect x="70" y="290" width="250" height="44" rx="5" fill="#F4EEE3" stroke="#3E4A52" stroke-width=".8"></rect><text x="195.0" y="304.0" text-anchor="middle" font-size="7.6" font-weight="600" fill="#23282C">5 · Campo con più nomi?</text><text x="195.0" y="315.0" text-anchor="middle" font-size="7.6" fill="#23282C">guarda il femico accessorio</text><text x="195.0" y="326.0" text-anchor="middle" font-size="7.6" fill="#23282C">anfibolo → diorite · pirosseno → gabbro · quasi solo plag. → anortosite</text><rect x="430" y="62" width="200" height="34" rx="5" fill="#F4EEE3" stroke="#3E4A52" stroke-width=".8"></rect><text x="530.0" y="76.5" text-anchor="middle" font-size="8.6" font-weight="600" fill="#23282C">Ha fenocristalli?</text><text x="530.0" y="87.5" text-anchor="middle" font-size="8.6" fill="#23282C">(tessitura porfirica)</text><path d="M470,96 L470,118" stroke="#6B7378" stroke-width="1.3" marker-end="url(#af)"></path><text x="474.0" y="105.0" font-size="7.5" fill="#B5552A" font-weight="600">sì</text><path d="M590,96 L590,118" stroke="#6B7378" stroke-width="1.3" marker-end="url(#af)"></path><text x="594.0" y="105.0" font-size="7.5" fill="#B5552A" font-weight="600">no</text><rect x="410" y="118" width="130" height="60" rx="5" fill="#B5552A" stroke="#3E4A52" stroke-width=".8"></rect><text x="475.0" y="134.5" text-anchor="middle" font-size="7.6" font-weight="600" fill="#fff">Streckeisen effusive</text><text x="475.0" y="145.5" text-anchor="middle" font-size="7.6" fill="#fff">sui soli fenocristalli:</text><text x="475.0" y="156.5" text-anchor="middle" font-size="7.6" fill="#fff">quarzo → sopra (riolite…)</text><text x="475.0" y="167.5" text-anchor="middle" font-size="7.6" fill="#fff">feldspatoidi → sotto</text><rect x="550" y="118" width="85" height="60" rx="5" fill="#9AA3A8" stroke="#3E4A52" stroke-width=".8"></rect><text x="592.5" y="134.5" text-anchor="middle" font-size="7.6" font-weight="600" fill="#fff">Non si classifica</text><text x="592.5" y="145.5" text-anchor="middle" font-size="7.6" fill="#fff">a occhio nudo</text><text x="592.5" y="156.5" text-anchor="middle" font-size="7.6" fill="#fff">solo indice di colore</text><text x="592.5" y="167.5" text-anchor="middle" font-size="7.6" fill="#fff">→ laboratorio</text><rect x="410" y="200" width="225" height="50" rx="5" fill="#C9B79C" stroke="#3E4A52" stroke-width=".8"></rect><text x="522.5" y="217.0" text-anchor="middle" font-size="7.6" font-weight="600" fill="#23282C">Vetrosa?</text><text x="522.5" y="228.0" text-anchor="middle" font-size="7.6" fill="#23282C">0 vescicole: ossidiana · ≥ 50%: pomice</text><text x="522.5" y="239.0" text-anchor="middle" font-size="7.6" fill="#23282C">&lt; 50%: scoria · frammentaria: piroclastite</text></svg>
