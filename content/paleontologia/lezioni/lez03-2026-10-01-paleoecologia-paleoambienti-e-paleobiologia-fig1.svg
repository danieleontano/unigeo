<svg viewBox="0 0 640 140" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif"><rect x="40" y="96" width="304" height="18" fill="#C9B79C"></rect><text x="192" y="109" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Paleozoico</text><rect x="344" y="96" width="196" height="18" fill="#D4A24C"></rect><text x="442" y="109" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Mesozoico</text><rect x="540" y="96" width="70" height="18" fill="#1F6F78"></rect><text x="575" y="109" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">Cenozoico</text><text x="82" y="126" text-anchor="middle" font-size="7.5" fill="#6B7378">500</text><text x="188" y="126" text-anchor="middle" font-size="7.5" fill="#6B7378">400</text><text x="293" y="126" text-anchor="middle" font-size="7.5" fill="#6B7378">300</text><text x="399" y="126" text-anchor="middle" font-size="7.5" fill="#6B7378">200</text><text x="504" y="126" text-anchor="middle" font-size="7.5" fill="#6B7378">100</text><text x="610" y="126" text-anchor="middle" font-size="7.5" fill="#6B7378">0</text><text x="325.0" y="137" text-anchor="middle" font-size="7.5" fill="#6B7378">milioni di anni fa</text><line x1="141" y1="78" x2="141" y2="96" stroke="#B5552A" stroke-width="1.5"></line><circle cx="141" cy="70" r="8" fill="#B5552A"></circle><text x="141" y="73" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">1</text><text x="152" y="68" font-size="8" font-weight="600" fill="#23282C">fine Ordoviciano</text><text x="152" y="78" font-size="7.5" fill="#3E4A52">glaciazione</text><line x1="217" y1="26" x2="217" y2="96" stroke="#B5552A" stroke-width="1.5"></line><circle cx="217" cy="18" r="8" fill="#B5552A"></circle><text x="217" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">2</text><text x="228" y="16" font-size="8" font-weight="600" fill="#23282C">fine Devoniano</text><text x="228" y="26" font-size="7.5" fill="#3E4A52">anossia (non al limi