<svg viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif"><defs><marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7378"></path></marker></defs><g stroke="#6B7378" stroke-width="1.4" fill="none"><line x1="100" y1="90" x2="118" y2="90" marker-end="url(#ar3)"></line><line x1="206" y1="90" x2="224" y2="90" marker-end="url(#ar3)"></line><line x1="312" y1="90" x2="330" y2="90" marker-end="url(#ar3)"></line><line x1="418" y1="90" x2="436" y2="90" marker-end="url(#ar3)"></line><line x1="524" y1="90" x2="542" y2="90" marker-end="url(#ar3)"></line></g><g transform="translate(10,20)"><rect x="0" y="80" width="88" height="40" fill="#C9B79C"></rect><path d="M22,105 c0,-10 10,-16 22,-16 s22,6 22,16 c0,6 -10,10 -22,10 s-22,-4 -22,-10z" fill="#F4EEE3" stroke="#3E4A52" stroke-width="1.5"></path><line x1="40" y1="92" x2="36" y2="70" stroke="#1F6F78" stroke-width="2.2"></line><line x1="48" y1="92" x2="52" y2="70" stroke="#1F6F78" stroke-width="2.2"></line><path d="M0,68 q11,-5 22,0 t22,0 t22,0 t22,0" fill="none" stroke="#1F6F78" stroke-width="1.2"></path><text x="44" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1F6F78">1 · vive</text><text x="44" y="30" text-anchor="middle" font-size="7.5" fill="#3E4A52">infaunale, fondo argilloso</text><text x="44" y="40" text-anchor="middle" font-size="7.5" fill="#3E4A52">sifoni lunghi</text></g><g transform="translate(116,20)"><rect x="0" y="80" width="88" height="40" fill="#C9B79C"></rect><path d="M44,100 c-8,-12 -26,-10 -30,2 c8,4 20,4 30,-2z" fill="#F4EEE3" stroke="#3E4A52" stroke-width="1.5"></path><path d="M44,100 c8,-12 26,-10 30,2 c-8,4 -20,4 -30,-2z" fill="#F4EEE3" stroke="#3E4A52" stroke-width="1.5"></path><circle cx="44" cy="100" r="2" fill="#D4A24C"></circle><text x="44" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1F6F78">2 · muore</text><text x="44" y="30" text-anchor="middle" font-size="7.5" fill="#3E4A52">il muscolo si rilassa,</text><text x="44" y="40" text-anchor="middle" font-size="7.5" fill="#3E4A52">il legamento apre le valve</text></g><g transform="translate(222,20)"><rect x="0" y="80" width="88" height="40" fill="#C9B79C"></rect><path d="M8,96 c4,-12 22,-12 28,0 c-8,4 -20,4 -28,0z" fill="#F4EEE3" stroke="#3E4A52" stroke-width="1.5"></path><path d="M52,104 c4,-12 22,-12 28,0 c-8,4 -20,4 -28,0z" fill="#F4EEE3" stroke="#3E4A52" stroke-width="1.5" transform="rotate(-20 66 100)"></path><path d="M10,66 q8,6 16,0 t16,0" fill="none" stroke="#1F6F78" stroke-width="1.2" marker-end="url(#ar3)"></path><text x="44" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1F6F78">3 · disarticola</text><text x="44" y="30" text-anchor="middle" font-size="7.5" fill="#3E4A52">decomposizione + energia:</text><text x="44" y="40" text-anchor="middle" font-size="7.5" fill="#3E4A52">c'era corrente</text></g><g transform="translate(328,20)"><rect x="0" y="80" width="88" height="40" fill="#C9B79C"></rect><path d="M22,96 c8,-16 36,-16 44,0 c-12,5 -32,5 -44,0z" fill="#F4EEE3" stroke="#3E4A52" stroke-width="1.5"></path><path d="M30,86 q4,-6 8,0 q4,6 8,0" fill="none" stroke="#fff" stroke-width="2.2"></path><path d="M30,86 q4,-6 8,0 q4,6 8,0" fill="none" stroke="#3E4A52" stroke-width=".8"></path><text x="44" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1F6F78">4 · unico substrato duro</text><text x="44" y="30" text-anchor="middle" font-size="7.5" fill="#3E4A52">serpulidi (anellidi)</text><text x="44" y="40" text-anchor="middle" font-size="7.5" fill="#3E4A52">incrostano la valva</text></g><g transform="translate(434,20)"><rect x="0" y="80" width="88" height="40" fill="#C9B79C"></rect><path d="M22,96 c8,-16 36,-16 44,0 c-12,5 -32,5 -44,0z" fill="#F4EEE3" stroke="#3E4A52" stroke-width="1.5"></path><g fill="#3E4A52"><circle cx="32" cy="92" r="1.1"></circle><circle cx="38" cy="88" r="1.1"></circle><circle cx="45" cy="93" r="1.1"></circle><circle cx="51" cy="87" r="1.1"></circle><circle cx="56" cy="92" r="1.1"></circle><circle cx="42" cy="96" r="1.1"></circle><circle cx="50" cy="96" r="1.1"></circle><circle cx="35" cy="96" r="1.1"></circle></g><text x="44" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1F6F78">5 · perforata</text><text x="44" y="30" text-anchor="middle" font-size="7.5" fill="#3E4A52">spugne (Cliona), fori 2 mm</text><text x="44" y="40" text-anchor="middle" font-size="7.5" fill="#3E4A52">= tracce fossili</text></g><g transform="translate(540,20)"><rect x="0" y="80" width="88" height="40" fill="#C9B79C"></rect><path d="M22,96 c8,16 36,16 44,0 c-12,-5 -32,-5 -44,0z" fill="#F4EEE3" stroke="#3E4A52" stroke-width="1.5"></path><g fill="#3E4A52"><circle cx="35" cy="100" r="1.1"></circle><circle cx="44" cy="104" r="1.1"></circle><circle cx="53" cy="100" r="1.1"></circle></g><path d="M14,70 a30,14 0 0 1 60,0" fill="none" stroke="#1F6F78" stroke-width="1.2" marker-end="url(#ar3)"></path><text x="44" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#1F6F78">6 · da entrambi i lati</text><text x="44" y="30" text-anchor="middle" font-size="7.5" fill="#3E4A52">fori sopra e sotto:</text><text x="44" y="40" text-anchor="middle" font-size="7.5" fill="#3E4A52">la corrente la rivoltava</text></g><text x="320" y="165" text-anchor="middle" font-size="9" fill="#3E4A52">Risultato: bivalve infaunale, morto in un ambiente fangoso senza substrati duri, con abbastanza energia da disarticolare e rivoltare la valva.</text><text x="320" y="180" text-anchor="middle" font-size="9" fill="#3E4A52">Tutto ciò che è sopra la valva è arrivato dopo la morte: i fori sono anche all'interno.</text></svg>
