<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif"><rect x="20" y="212" width="600" height="70" rx="6" fill="#1F6F78"></rect><text x="320" y="236" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="600">PALEONTOLOGIA SISTEMATICA · il primo gradino, il nostro anno</text><g fill="#E6F0F1" font-size="9.5" text-anchor="middle"><text x="95" y="258">Paleobotanica</text><text x="95" y="271">piante fossili</text><text x="245" y="258">Paleozoologia</text><text x="245" y="271">animali fossili</text><text x="395" y="258">Micropaleontologia</text><text x="395" y="271">protisti, alghe, batteri</text><text x="545" y="258">Paleoicnologia</text><text x="545" y="271">tracce fossili</text></g><g><rect x="20" y="126" width="140" height="66" rx="6" fill="#D4A24C"></rect><text x="90" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#23282C">Tafonomia</text><text x="90" y="162" text-anchor="middle" font-size="8.5" fill="#23282C">come si è fossilizzato</text><text x="90" y="174" text-anchor="middle" font-size="8.5" fill="#23282C">6–8 modi diversi</text><rect x="173" y="126" width="140" height="66" rx="6" fill="#D4A24C"></rect><text x="243" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#23282C">Paleoecologia</text><text x="243" y="162" text-anchor="middle" font-size="8.5" fill="#23282C">organismo ↔ ambiente</text><text x="243" y="174" text-anchor="middle" font-size="8.5" fill="#23282C">che mare, quanto profondo</text><rect x="326" y="126" width="140" height="66" rx="6" fill="#D4A24C"></rect><text x="396" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#23282C">Paleobiologia</text><text x="396" y="162" text-anchor="middle" font-size="8.5" fill="#23282C">come viveva, si muoveva</text><text x="396" y="174" text-anchor="middle" font-size="8.5" fill="#23282C">morfologia funzionale</text><rect x="479" y="126" width="141" height="66" rx="6" fill="#D4A24C"></rect><text x="549" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#23282C">Biostratigrafia</text><text x="549" y="162" text-anchor="middle" font-size="8.5" fill="#23282C">datare la roccia col fossile</text><text x="549" y="174" text-anchor="middle" font-size="8.5" fill="#23282C">dove sta lo stipendio</text></g><g><rect x="60" y="40" width="160" height="66" rx="6" fill="#3E4A52"></rect><text x="140" y="61" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Paleobiogeografia</text><text x="140" y="76" text-anchor="middle" font-size="8.5" fill="#DDD5C7">distribuzione nello spazio</text><text x="140" y="88" text-anchor="middle" font-size="8.5" fill="#DDD5C7">perché il T. rex solo in N. America</text><rect x="240" y="40" width="160" height="66" rx="6" fill="#3E4A52"></rect><text x="320" y="61" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Paleont. ambientale</text><text x="320" y="76" text-anchor="middle" font-size="8.5" fill="#DDD5C7">conservation paleobiology</text><text x="320" y="88" text-anchor="middle" font-size="8.5" fill="#DDD5C7">ultimi 5–20 mila anni</text><rect x="420" y="40" width="160" height="66" rx="6" fill="#3E4A52"></rect><text x="500" y="61" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Paleont. evolutiva</text><text x="500" y="76" text-anchor="middle" font-size="8.5" fill="#DDD5C7">testare l'evoluzione</text><text x="500" y="88" text-anchor="middle" font-size="8.5" fill="#DDD5C7">sul record fossile</text></g><text x="20" y="26" font-size="8.5" fill="#6B7378">↑ ricerca e finanziamenti: si può fare solo dopo i due gradini sotto</text><text x="20" y="120" font-size="8.5" fill="#6B7378">↑ aggiungere informazioni al fossile riconosciuto</text><text x="20" y="206" font-size="8.5" fill="#6B7378">↑ prima di tutto: riconoscere chi è</text></svg>
